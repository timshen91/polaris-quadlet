# Installed as /etc/systemd/user/gamescope-session.service.d/50-polaris-fake-display.conf.
# Unplug Polaris's fake display while Game Mode's gamescope still runs, so it
# moves off it before it is torn down: a compositor killed mid-flip on the fake
# display can leave amdgpu unable to flip that CRTC until the next restart.
[Service]
ExecStop=-/usr/bin/systemctl start polaris-fake-display-unplug.service
